<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Redirecting…</title>
</head>
<body>
<p id="m">Redirecting…</p>
<script id="maria-links" type="application/json">{"best-french-onion-beef-sloppy-joes":"https://cookmingle.com/best-french-onion-beef-sloppy-joes/","budget-ground-beef-and-cabbage-casserole":"https://cookmingle.com/budget-ground-beef-and-cabbage-casserole/","cajun-cream-cheese-alfredo-bowties-with-spiced-ground-beef":"https://cookmingle.com/cajun-cream-cheese-alfredo-bowties-with-spiced-ground-beef/","cheesy-bowtie-pasta-with-ground-beef":"https://cookmingle.com/cheesy-bowtie-pasta-with-ground-beef/","cheesy-bowtie-pasta-with-savory-cajun-ground-beef-in-garlic-cream":"https://cookmingle.com/cheesy-bowtie-pasta-with-savory-cajun-ground-beef-in-garlic-cream/"}</script>
<script>
(function () {
  var links = JSON.parse(document.getElementById("maria-links").textContent);
  var parts = location.search.replace(/^\?/, "").split("&");
  var slug = "";
  try { slug = decodeURIComponent(parts.shift() || ""); } catch (e) {}
  slug = slug.toLowerCase().replace(/\/+$/, "");
  var to = links[slug];
  if (!to) { document.title = "Page not found"; document.getElementById("m").textContent = "Page not found."; return; }
  var extra = parts.filter(Boolean).join("&");
  if (extra) {
    var h = to.indexOf("#"), hash = h < 0 ? "" : to.slice(h), u = h < 0 ? to : to.slice(0, h);
    to = u + (u.indexOf("?") < 0 ? "?" : "&") + extra + hash;
  }
  location.replace(to);
})();
</script>
</body>
</html>
